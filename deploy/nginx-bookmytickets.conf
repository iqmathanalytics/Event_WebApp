# DigitalOcean Droplet Nginx site for Book My Tickets
# Install: /etc/nginx/sites-available/bookmytickets
#
# Canonical host: https://www.bookmytickets.us
# Apex bookmytickets.us always 301 → www (path + query preserved).
#
# Critical: use ^~ on /api/ so regex locations for *.png do not steal
# /api/public/ticket-qr/<code>.png (Entry QR images).
#
# SSL: Cloudflare Full / Full (strict) requires :443 on origin.
# Prefer a Cloudflare Origin CA cert at /etc/ssl/cloudflare/origin.{crt,key}.
# A temporary self-signed cert works with SSL mode "Full" (not "Full Strict").

# HTTP → HTTPS www (apex and www)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bookmytickets.us www.bookmytickets.us _;

    return 301 https://www.bookmytickets.us$request_uri;
}

# HTTPS apex → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookmytickets.us;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.bookmytickets.us$request_uri;
}

# HTTPS www — app + API
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.bookmytickets.us _;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Helpful when behind Cloudflare
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/bookmytickets/frontend;
    index index.html;
    client_max_body_size 25m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api {
        return 301 /api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
